<style>
/* Ported from the 27B Space's app.py CSS — keep the two visually in sync.
   Palette = the Space's validated set; light + dark via media query,
   overridable with <html data-theme="light|dark"> (?theme= query param). */
:root{
  --nla-surface:#fcfcfb; --nla-page:#f6f6f4; --nla-ink:#0b0b0b; --nla-ink2:#52514e;
  --nla-muted:#898781; --nla-grid:#e1e0d9; --nla-axis:#c3c2b7; --nla-pos:#2a78d6;
  --nla-neg:#e34948; --nla-warn:#c98500; --nla-wash:rgba(11,11,11,.045);
  --nla-ring:rgba(11,11,11,.10); --nla-hover:rgba(42,120,214,.16); --nla-sel:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --nla-surface:#1a1a19; --nla-page:#111110; --nla-ink:#ffffff; --nla-ink2:#c3c2b7;
    --nla-muted:#898781; --nla-grid:#2c2c2a; --nla-axis:#383835; --nla-pos:#3987e5;
    --nla-neg:#e66767; --nla-warn:#c98500; --nla-wash:rgba(255,255,255,.055);
    --nla-ring:rgba(255,255,255,.10); --nla-hover:rgba(57,135,229,.30); --nla-sel:#3987e5;
  }
}
:root[data-theme=dark]{
  --nla-surface:#1a1a19; --nla-page:#111110; --nla-ink:#ffffff; --nla-ink2:#c3c2b7;
  --nla-muted:#898781; --nla-grid:#2c2c2a; --nla-axis:#383835; --nla-pos:#3987e5;
  --nla-neg:#e66767; --nla-warn:#c98500; --nla-wash:rgba(255,255,255,.055);
  --nla-ring:rgba(255,255,255,.10); --nla-hover:rgba(57,135,229,.30); --nla-sel:#3987e5;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--nla-page); color:var(--nla-ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
.wrap{max-width:1200px; margin:0 auto; padding:14px 16px 18px;}

.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.tabs button{font:inherit; font-size:12px; padding:5px 12px; border-radius:999px;
  border:1px solid var(--nla-ring); background:var(--nla-surface);
  color:var(--nla-ink2); cursor:pointer;}
.tabs button:hover{background:var(--nla-wash);}
.tabs button.on{background:var(--nla-sel); border-color:var(--nla-sel); color:#fff;}

.cols{display:grid; grid-template-columns:minmax(0,6fr) minmax(0,5fr); gap:14px;
  align-items:start;}
@media (max-width:880px){ .cols{grid-template-columns:minmax(0,1fr);} .side{position:static;} }
.side{position:sticky; top:12px;}

.bars{display:flex; flex-direction:column; gap:6px; align-items:flex-start;
  margin-bottom:8px;}
.modebar{display:flex; gap:0; border:1px solid var(--nla-ring);
  border-radius:8px; overflow:hidden; width:max-content; background:var(--nla-surface);}
.modebar button{font:inherit; font-size:11.5px; padding:5px 12px; border:none;
  background:transparent; color:var(--nla-ink2); cursor:pointer;}
.modebar button.on{background:var(--nla-sel); color:#fff;}
#heatbar button.on{background:var(--nla-neg);}

/* token panel — the honeypot transcript is ~4.7k tokens; it scrolls inside
   the panel, never the page */
.tokpanel{background:var(--nla-surface); border:1px solid var(--nla-ring);
  border-radius:12px; overflow:hidden;}
.tokhead{display:flex; justify-content:space-between; gap:12px; padding:8px 14px;
  font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
  color:var(--nla-muted); border-bottom:1px solid var(--nla-grid);}
.tokscroll{padding:12px 14px 16px; max-height:62vh; overflow-y:auto;
  scrollbar-width:thin; white-space:pre-wrap; overflow-wrap:anywhere;
  font-size:14px; line-height:2.0; color:var(--nla-ink);}
.nla-tok{cursor:pointer; border-radius:4px; padding:2.5px 0;}
.nla-tok:nth-child(2n){background:var(--nla-wash);}
.nla-tok:hover, .nla-tok:focus-visible{background:var(--nla-hover); outline:none;}
.nla-tok.sel{background:var(--nla-sel); color:#fff;}
.nla-tok .nl{color:var(--nla-muted); font-size:10px;}
.nla-tok.sel .nl{color:rgba(255,255,255,.75);}
/* eval-awareness heatmap: the heat bar flips a body class; tokens carry their
   scores as CSS vars, so switching modes re-renders nothing */
body.nla-heat-p .nla-tok{background-color:rgba(224,58,58, calc(var(--pa,0)*0.85));}
body.nla-heat-f .nla-tok{background-color:rgba(224,58,58, calc(var(--paf,0)*0.85));}
body.nla-heat-fn .nla-tok{background-color:rgba(224,58,58, calc(var(--pafn,0)*0.85));}
body[class*="nla-heat"] .nla-tok:hover, body[class*="nla-heat"] .nla-tok:focus-visible{background:var(--nla-hover);}
body[class*="nla-heat"] .nla-tok.sel{background:var(--nla-sel);}
/* per-line badges: hidden unless a heatmap mode is active */
.eabadge{display:none; min-width:2.3em; text-align:center; font-size:9px; font-weight:700;
  padding:0 3px; margin-right:5px; border-radius:3px; color:#fff; vertical-align:middle;
  background:rgba(198,52,52, calc(var(--pea,0)*0.65 + 0.35));}
body[class*="nla-heat"] .eabadge{display:inline-block;}

/* results card */
.nlaviz{background:var(--nla-surface); border:1px solid var(--nla-ring);
  border-radius:12px; padding:16px 18px; color:var(--nla-ink);}
.nlaviz .title{font-size:13px; font-weight:600; margin-bottom:2px;}
.nlaviz .sub{font-size:11.5px; color:var(--nla-ink2); margin-bottom:12px;}
.nlaviz .chips{display:flex; gap:22px; margin-bottom:14px; flex-wrap:wrap;}
.nlaviz .chip .v{font-size:20px; font-weight:650;}
.nlaviz .chip .l{font-size:10.5px; color:var(--nla-muted); text-transform:uppercase;
  letter-spacing:.04em; margin-top:1px;}
.nlaviz .row{display:grid; grid-template-columns:16px minmax(0,1fr) 96px 48px;
  gap:10px; align-items:center; padding:5px 6px; border-radius:6px;}
.nlaviz .row:hover{background:var(--nla-wash);}
.nlaviz .idx{font-size:11px; color:var(--nla-muted); text-align:right;
  font-variant-numeric:tabular-nums;}
.nlaviz .line{font-size:12.5px; line-height:1.45; color:var(--nla-ink);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.nlaviz .track{position:relative; height:14px;}
.nlaviz .zero{position:absolute; top:-3px; bottom:-3px; width:1px; background:var(--nla-axis);}
.nlaviz .bar{position:absolute; top:2px; height:10px;}
.nlaviz .bar.pos{background:var(--nla-pos); border-radius:0 4px 4px 0;}
.nlaviz .bar.neg{background:var(--nla-neg); border-radius:4px 0 0 4px;}
.nlaviz .val{font-size:11.5px; color:var(--nla-ink2); text-align:right;
  font-variant-numeric:tabular-nums;}
.nlaviz .axisrow{display:grid; grid-template-columns:16px minmax(0,1fr) 96px 48px;
  gap:10px; padding:2px 6px 0;}
.nlaviz .axislab{position:relative; height:14px; font-size:10px; color:var(--nla-muted);
  font-variant-numeric:tabular-nums;}
.nlaviz .axislab span{position:absolute; transform:translateX(-50%);}
.nlaviz .note{font-size:11px; color:var(--nla-ink2); margin-top:10px;}
.nlaviz .warnic{color:var(--nla-warn);}
.nlaviz .empty{padding:36px 12px; text-align:center; color:var(--nla-muted); font-size:13px;}

footer{margin-top:12px; font-size:11px; color:var(--nla-muted);}
footer a{color:var(--nla-pos); text-decoration:none;}
footer a:hover{text-decoration:underline;}
</style><style>
.wrap{padding:4px 2px 8px;}
.tokscroll{max-height:320px;font-size:13px;line-height:1.85;}
.tokhead{padding:6px 12px;}
.tabs{margin-bottom:8px;}
.tabs button{padding:4px 10px;font-size:11.5px;}
.bars{gap:4px;margin-bottom:6px;}
.modebar button{padding:4px 10px;font-size:11px;}
.nlaviz{padding:10px 10px 10px 8px;}
.nlaviz .sub{margin-bottom:8px;}
.nlaviz .chips{gap:16px;margin-bottom:10px;}
.nlaviz .chip .v{font-size:16px;}
.nlaviz .row,.nlaviz .axisrow{grid-template-columns:10px minmax(0,1fr) 68px 40px;gap:6px;}
.nlaviz .row{padding:3px 2px;}
.nlaviz .line{font-size:10px;line-height:1.3;-webkit-line-clamp:3;}
.nlaviz .idx{font-size:9.5px;}
.nlaviz .val{font-size:10.5px;}
.nlaviz .note{margin-top:6px;font-size:10.5px;}
/* the 68px axis track can't fit lo + zero labels without collision */
.nlaviz .axislab span:first-child:nth-last-child(3){display:none;}
/* sandbox can't open links; attribution lives in the post body instead */
footer{display:none;}
/* heatmap overlay isn't useful in the widget — drop the eval-awareness heat bar
   (CSS display:none beats the JS that un-hides it when EA data loads; the token
   overlay + badges only render under a heat mode that can no longer be picked) */
#heatbar{display:none;}
/* two-pane once the column is wide enough (560px was fine). The bug was vertical:
   the token box was a short 320px panel next to the taller results card, so the
   left column had blank space below it. Give the token box ~the results-card
   height in two-pane so it fills the column (transcript scrolls inside). Can't
   auto-stretch to match: the iframe is auto-height and an `auto` grid row would
   size to the full 4.7k-token transcript and blow up. Narrow/stacked keeps 320px. */
@media (min-width:560px){
  .cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
  .side{position:static;}
  .tokscroll{max-height:500px;}
}
</style>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="cols">
    <section id="tok-slot">
      <div class="tokpanel"><div class="tokscroll" id="loading">loading precomputed data…</div></div>
    </section>
    <aside class="side">
      <div class="bars">
        <div class="modebar" id="modebar" hidden>
          <button data-m="marginal" class="on">marginal ΔFVE</button>
          <button data-m="cumulative">cumulative</button>
          <button data-m="ablation" hidden>ablation</button>
        </div>
        <div class="modebar" id="heatbar" hidden>
          <button data-h="off" class="on">heat off</button>
          <button data-h="p">P(aware)</button>
          <button data-h="f">×ΔFVE</button>
          <button data-h="fn">÷rank</button>
        </div>
      </div>
      <div id="viz-slot"></div>
    </aside>
  </div>
  <footer id="foot"></footer>
</div>
<script>
"use strict";
// Injected by build_embed.py: {"urls": {pre, ea, loo}} to fetch, or
// {"inline": {pre, ea, loo}} with the data baked in (ea/loo may be null).
const DATA_SOURCE = {"urls": {"pre": "https://huggingface.co/spaces/syvb/nla-qwen36-27b-explorer/resolve/main/precache.json", "ea": "https://huggingface.co/spaces/syvb/nla-qwen36-27b-explorer/resolve/main/eval_awareness.json", "loo": "https://huggingface.co/spaces/syvb/nla-qwen36-27b-explorer/resolve/main/loo.json"}};
// true in the LessWrong-widget build: its sandbox (allow-scripts only) can
// never open links — the footer is hidden by widget CSS and the error card
// shows a plain URL instead of a dead anchor.
const IS_WIDGET = true;
const SPACE_URL_TEXT = "huggingface.co/spaces/syvb/nla-qwen36-27b-explorer";
const TAB_LABELS = ["Pageant news", "iOS simulator error", "Ocean bacteria",
                    "DEA / CBD", "⚠️ Blackmail honeypot"];
const HONEYPOT_PREFIX = "<|im_start|>system";
const GOOD_MIN_POS = 10;
const CJK_RE = /[　-ヿ㐀-䶿一-鿿＀-￯]/;

let DATA = null, EA = null, LOOD = null;
let curText = 0, curPos = null, mode = "marginal", heat = "off";

const $ = (s) => document.querySelector(s);
// numeric refs built at runtime — the SOURCE must contain no decodable
// entity sequences (LessWrong's publish pipeline entity-decodes widget
// source once; a spelled-out named entity here would decode into broken JS)
const esc = (s) => s.replace(/[&<>"]/g, (c) => "&#" + c.charCodeAt(0) + ";");
const f2 = (x) => x.toFixed(2);
const f3 = (x) => x.toFixed(3);
const s3 = (x) => (x >= 0 ? "+" : "") + x.toFixed(3);

function card(msg) {
  return `<div class="nlaviz"><div class="empty">${msg}</div></div>`;
}

function renderTabs() {
  $("#tabs").innerHTML = DATA.entries.map((e, i) =>
    `<button data-t="${i}" title="${esc(e.text.slice(0, 90))}…"
       class="${i === curText ? "on" : ""}">${esc(TAB_LABELS[i] || "Example " + (i + 1))}</button>`).join("");
}

function renderTokens() {
  const e = DATA.entries[curText];
  const ea = EA && EA.entries[curText];
  const spans = e.pieces.map((p, i) => {
    const body = esc(p).replace(/\n/g, '<span class="nl">⏎</span><br>');
    const sel = i === curPos ? " sel" : "";
    let style = "";
    if (ea && ea.paware[i] !== null && ea.paware[i] !== undefined) {
      const pa = ea.paware[i] || 0, paf = (ea.paware_fvew || [])[i] || 0,
            pafn = (ea.paware_fvewnorm || [])[i] || 0;
      style = ` style="--pa:${pa.toFixed(3)};--paf:${paf.toFixed(3)};--pafn:${pafn.toFixed(3)}"`;
    }
    return `<span class="nla-tok${sel}" data-i="${i}" title="#${i}"${style} role="button" tabindex="0">${body}</span>`;
  }).join("");
  $("#tok-slot").innerHTML =
    `<div class="tokpanel"><div class="tokhead"><span>${e.pieces.length} tokens · precomputed</span>` +
    `<span>click a token to inspect it</span></div>` +
    `<div class="tokscroll">${spans}</div></div>`;
}

function renderViz() {
  if (curPos === null) { $("#viz-slot").innerHTML = card("👈 Click any token to read its activation."); return; }
  const e = DATA.entries[curText];
  const res = e.results[curPos];
  if (!res) { $("#viz-slot").innerHTML = card("This position wasn't precomputed — try it on the live Space."); return; }
  const { lines, fve, cos } = res;
  const marginal = fve.map((v, k) => k === 0 ? v : v - fve[k - 1]);
  const L = LOOD && LOOD.entries[curText];
  const looArr = mode === "ablation" && L && L.loo[curPos] &&
                 L.loo[curPos].length === lines.length ? L.loo[curPos] : null;
  const looFull = looArr !== null ? L.full[curPos] : null;
  const looMissing = mode === "ablation" && looArr === null;
  let vals, title, sub;
  if (looArr) {
    vals = looArr.map((x) => looFull - x);  // necessity of each line
    title = "FVE lost when each line is deleted (leave-one-out)";
    sub = "all OTHER lines kept — necessity, not salience order; a small bar with a " +
          "large ΔFVE means the line is redundant with later ones";
  } else {
    vals = mode === "cumulative" ? fve : marginal;
    title = mode === "cumulative" ? "Cumulative round-trip FVE by explanation-line prefix"
                                  : "Additional FVE per explanation line (ΔFVE)";
    sub = mode === "cumulative" ? "reconstruction quality from lines 1..k only"
                                : "how much reconstruction each successive line adds";
  }
  const lo = Math.min(0, Math.min(...vals)), hi = Math.max(0.05, Math.max(...vals));
  const span = hi - lo, zeroPct = (0 - lo) / span * 100;
  const pl = EA && EA.entries[curText] && (EA.entries[curText].paware_lines || [])[curPos];

  const rows = lines.map((ln, i) => {
    const x = vals[i], w = Math.abs(x) / span * 100;
    const left = x >= 0 ? zeroPct : zeroPct - w;
    const cls = x >= 0 ? "pos" : "neg";
    let tip = `line ${i + 1} — ΔFVE ${s3(marginal[i])}, cumulative ${f3(fve[i])}, cos ${f3(cos[i])}`;
    if (looArr) tip += `, delete→lose ${s3(x)}, alone ${s3(L.solo[curPos][i])}`;
    const pv = pl && pl[i] !== null && pl[i] !== undefined ? pl[i] : null;
    const badge = pv === null ? "" :
      `<span class="eabadge" style="--pea:${pv.toFixed(3)}" title="P(eval-aware)=${f2(pv)}">${f2(pv)}</span>`;
    return `<div class="row" title="${esc(tip)}"><div class="idx">${i + 1}</div>` +
      `<div class="line" title="${esc(ln)}">${badge}${esc(ln)}</div>` +
      `<div class="track"><div class="zero" style="left:${zeroPct.toFixed(2)}%"></div>` +
      `<div class="bar ${cls}" style="left:${left.toFixed(2)}%;width:${Math.max(w, 0.4).toFixed(2)}%"></div></div>` +
      `<div class="val">${s3(x)}</div></div>`;
  }).join("");

  const axisSpans = [`<span style="left:${zeroPct.toFixed(2)}%">0</span>`,
                     `<span style="left:100%">${hi.toFixed(2)}</span>`];
  if (zeroPct >= 10) axisSpans.unshift(`<span style="left:0%">${lo.toFixed(2)}</span>`);
  const axis = `<div class="axisrow"><div></div><div></div>` +
    `<div class="axislab">${axisSpans.join("")}</div><div></div></div>`;

  const piece = e.pieces[curPos].trim() || JSON.stringify(e.pieces[curPos]);
  const chips = `<div class="chips">` +
    `<div class="chip"><div class="v">${f3(fve[fve.length - 1])}</div><div class="l">FVE · all ${lines.length} lines</div></div>` +
    `<div class="chip"><div class="v">${f3(cos[cos.length - 1])}</div><div class="l">cosine</div></div>` +
    `<div class="chip"><div class="v">${esc(piece)}</div><div class="l">token @ ${curPos}</div></div></div>`;

  const notes = [];
  if (looMissing)
    notes.push('<span class="warnic">⚠</span> no ablation scores for this position — showing marginal ΔFVE.');
  if (curPos < GOOD_MIN_POS)
    notes.push('<span class="warnic">⚠</span> very early position — little left-context; ' +
               'explanations may be generic.');
  if (lines.some((ln) => CJK_RE.test(ln)))
    notes.push('<span class="warnic">⚠</span> stray CJK character in output ' +
               '(minor known drift of the RL policy).');
  const noteHtml = notes.length ? `<div class="note">${notes.join(" ")}</div>` : "";

  $("#viz-slot").innerHTML = `<div class="nlaviz"><div class="title">${title}</div>` +
    `<div class="sub">${sub}</div>${chips}${rows}${axis}${noteHtml}</div>`;
}

function syncHash() {
  try {
    const h = `#t=${curText}` + (curPos !== null ? `&p=${curPos}` : "") +
              `&m=${mode}` + (heat !== "off" ? `&h=${heat}` : "");
    history.replaceState(null, "", h);
  } catch (e) { /* sandboxed iframes may forbid this */ }
}

function randomPos(entry) {
  // avoid the low-context early positions the card would warn about
  const n = entry.pieces.length;
  const lo = Math.min(GOOD_MIN_POS, n - 1);
  const cands = [];
  for (let i = lo; i < n; i++) if (entry.results[i]) cands.push(i);
  if (!cands.length) for (let i = 0; i < n; i++) if (entry.results[i]) cands.push(i);
  return cands.length ? cands[Math.floor(Math.random() * cands.length)] : 0;
}

function scrollSelIntoView() {
  const panel = $(".tokscroll"), sel = $(".nla-tok.sel");
  if (!panel || !sel) return;
  const dp = panel.getBoundingClientRect(), ds = sel.getBoundingClientRect();
  // scroll only the panel (never the page — this may live in an iframe)
  panel.scrollTop += ds.top - dp.top - panel.clientHeight / 2 + ds.height / 2;
}

function selectText(t, pos = null) {
  curText = t;
  curPos = pos === null ? randomPos(DATA.entries[t]) : pos;
  renderTabs(); renderTokens(); renderViz(); syncHash(); scrollSelIntoView();
}

function setHeat(h) {
  heat = h;
  const b = document.body.classList;
  b.remove("nla-heat-p", "nla-heat-f", "nla-heat-fn");
  if (h !== "off") b.add("nla-heat-" + h);
  document.querySelectorAll("#heatbar button").forEach((x) =>
    x.classList.toggle("on", x.dataset.h === h));
}

function boot(pre, ea, loo) {
  DATA = pre;
  if (ea && ea.entries && ea.entries.length === pre.entries.length) EA = ea;
  if (loo && loo.entries && loo.entries.length === pre.entries.length) LOOD = loo;
  $("#modebar").hidden = false;
  if (LOOD) $('#modebar button[data-m="ablation"]').hidden = false;
  if (EA) $("#heatbar").hidden = false;
  const m = (location.hash.match(/[#&]m=(\w+)/) || [])[1];
  if (m === "cumulative" || m === "marginal" || (m === "ablation" && LOOD)) mode = m;
  document.querySelectorAll("#modebar button").forEach((b) =>
    b.classList.toggle("on", b.dataset.m === mode));
  const h = (location.hash.match(/[#&]h=(\w+)/) || [])[1];
  if (EA && (h === "p" || h === "f" || h === "fn")) setHeat(h);
  // default tab = the eval-awareness (blackmail honeypot) scenario
  let deft = pre.entries.findIndex((e) => e.text.startsWith(HONEYPOT_PREFIX));
  if (deft < 0) deft = 0;
  const tRaw = (location.hash.match(/[#&]t=(\d+)/) || [])[1];
  const t = tRaw === undefined ? deft :
    Math.min(parseInt(tRaw, 10) || 0, DATA.entries.length - 1);
  const pRaw = (location.hash.match(/[#&]p=(\d+)/) || [])[1];
  const p = pRaw === undefined ? null :
    Math.min(parseInt(pRaw, 10), DATA.entries[t].pieces.length - 1);
  selectText(t, p);
  $("#foot").innerHTML = `Precomputed samples from
    <a href="https://huggingface.co/${esc(DATA.meta.model_repo)}" target="_blank"
    rel="noopener">${esc(DATA.meta.model_repo)}</a> (matryoshka, layer 42)
    · <a href="https://huggingface.co/spaces/syvb/nla-qwen36-27b-explorer" target="_blank"
    rel="noopener">analyze your own text on the live Space</a>`;
}

document.addEventListener("click", (ev) => {
  const tok = ev.target.closest(".nla-tok");
  if (tok) {
    document.querySelectorAll(".nla-tok.sel").forEach((x) => x.classList.remove("sel"));
    tok.classList.add("sel");
    curPos = +tok.dataset.i; renderViz(); syncHash(); return;
  }
  const tab = ev.target.closest(".tabs button");
  if (tab) { selectText(+tab.dataset.t); return; }
  const hb = ev.target.closest("#heatbar button");
  if (hb) { setHeat(hb.dataset.h); syncHash(); return; }
  const mb = ev.target.closest("#modebar button");
  if (mb) {
    mode = mb.dataset.m;
    document.querySelectorAll("#modebar button").forEach((b) =>
      b.classList.toggle("on", b === mb));
    renderViz(); syncHash();
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  const tok = ev.target.closest && ev.target.closest(".nla-tok");
  if (tok) { ev.preventDefault(); tok.click(); }
});

const themeParam = new URLSearchParams(location.search).get("theme");
if (themeParam === "dark" || themeParam === "light")
  document.documentElement.dataset.theme = themeParam;

if (DATA_SOURCE.inline) {
  boot(DATA_SOURCE.inline.pre, DATA_SOURCE.inline.ea, DATA_SOURCE.inline.loo);
} else {
  const grab = (u) => fetch(u).then((r) => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  });
  Promise.all([
    grab(DATA_SOURCE.urls.pre),
    grab(DATA_SOURCE.urls.ea).catch(() => null),   // overlays are optional
    grab(DATA_SOURCE.urls.loo).catch(() => null),
  ]).then(([p, e, l]) => boot(p, e, l)).catch((err) => {
    $("#tok-slot").innerHTML = card(
      `couldn't load precomputed data (${esc(String(err))}) — ` +
      (IS_WIDGET ? `try the live demo: ${SPACE_URL_TEXT}`
                 : `<a href="https://huggingface.co/spaces/syvb/nla-qwen36-27b-explorer">use the live Space</a>`));
  });
}
</script>
